<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmos</title>
  <meta http-equiv="refresh" content="0; url=galaxy.html">
  <script>location.replace('galaxy.html' + location.hash);</script>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(60vmax 30vmax at 30% 70%, rgba(27, 18, 56, 0.55), transparent 70%),
        radial-gradient(50vmax 25vmax at 75% 30%, rgba(11, 42, 51, 0.45), transparent 70%),
        #02030a;
      color: rgba(255, 255, 255, 0.86);
      font: 14px/1.4 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.02em;
    }
    main { text-align: center; padding: 16px; }
    h1 {
      margin: 0 0 18px;
      font-weight: 300;
      font-size: 28px;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
    }
    a {
      color: rgba(207, 224, 255, 0.92);
      text-decoration: none;
      border: 1px solid rgba(207, 224, 255, 0.25);
      border-radius: 999px;
      padding: 8px 18px;
      transition: border-color 0.2s, background 0.2s;
    }
    a:hover, a:focus-visible { border-color: rgba(207, 224, 255, 0.6); background: rgba(207, 224, 255, 0.06); outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>COSMOS</h1>
    <p style="margin:0 0 22px"><a href="galaxy.html">Open the galaxy</a></p>
